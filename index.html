const KEY='serviceStandardPlatformV2';let state={route:'home',actions:[],inspections:[],draft:null,session:null,users:[{id:'manager',name:'Samuel McKeown',code:'2468',role:'manager'},{id:'inspector',name:'Inspector',code:'1357',role:'inspector'}],filters:{inspections:{search:'',site:'All',status:'All'},actions:{search:'',priority:'All',assignee:'All'},templates:{search:''}}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}state.users=state.users?.length?state.users:[{id:'manager',name:'Samuel McKeown',code:'2468',role:'manager'},{id:'inspector',name:'Inspector',code:'1357',role:'inspector'}];state.filters={inspections:{search:'',site:'All',status:'All'},actions:{search:'',priority:'All',assignee:'All'},templates:{search:''},...(state.filters||{})};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function currentUser(){return state.users.find(u=>u.id===state.session)||null}function isManager(){return currentUser()?.role==='manager'}function save(show=false){localStorage.setItem(KEY,JSON.stringify(state));if(show&&$('#toast')){$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),900)}}function go(route){if(['actions','templates','users'].includes(route)&&!isManager())route='inspections';state.route=route;save();render();scrollTo(0,0)}
function home(){const open=state.actions.filter(a=>a.status!=='Closed').length;return `<main class="page"><div class="page-head"><div><h1>Good afternoon, Sam!</h1><p>Your resort operations at a glance.</p></div></div><section class="stats"><div class="stat"><small>Heads Up</small><b>0</b></div><div class="stat"><small>Open actions</small><b>${open}</b></div><div class="stat"><small>Inspections</small><b>${state.inspections.length}</b></div><div class="stat"><small>Templates</small><b>${templates.length}</b></div></section><section class="card agenda"><div class="page-head"><div><h1 style="font-size:18px">Agenda</h1><p>Scheduled items and due dates assigned to you</p></div></div><div class="tabs"><button class="pill on">All</button><button class="pill">Inspections</button><button class="pill">Actions</button><button class="pill">Issues</button><button class="pill">Training</button></div>${open?state.actions.slice(0,4).map(actionRow).join(''):`<div class="empty"><i>🗓</i><b>All clear!</b><p>Your assigned work will appear here.</p></div>`}</section></main>`}
function inspections(){return `<main class="page"><div class="page-head"><div><h1>Inspections</h1><p>${state.inspections.length} saved inspections</p></div><button class="btn primary" onclick="pickTemplate()">＋ Start inspection</button></div><div class="filters"><input class="search" placeholder="Search inspections"><button class="pill">＋ Add filter</button></div><br><table class="table"><thead><tr><th>Inspection</th><th>Location</th><th>Score</th><th>Conducted</th><th>Completed</th><th></th></tr></thead><tbody>${state.inspections.length?state.inspections.map((x,i)=>`<tr><td><b>${esc(x.title)}</b><br><span class="muted">${esc(x.auditor)}</span></td><td>${esc(x.location)}</td><td class="score">${x.score}%</td><td>${x.date}</td><td>${x.complete?'Complete':'In progress'}</td><td><button class="link" onclick="openReport(${i})">View report</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty"><i>☑</i><b>No inspections yet</b><p>Start an inspection from one of your templates.</p></div></td></tr>`}</tbody></table></main>`}
function templatesPage(){return `<main class="page"><div class="page-head"><div><h1>Templates</h1><p>${templates.length} published templates</p></div></div><div class="filters"><input class="search" placeholder="Search all templates"><button class="pill">＋ Add filter</button></div><br><section class="card">${templates.map(t=>`<div class="template"><div><h3>${t.name}</h3><p>${t.desc}</p></div><span class="muted">17 Feb 2026</span><span class="muted">All users</span><button class="btn" onclick="startAudit('${t.id}')">Start inspection</button></div>`).join('')}</section></main>`}
function actionRow(a){return `<div class="action"><div><h3>⚑ ${esc(a.title)}</h3><p><span class="badge ${a.priority.toLowerCase()}">${a.priority}</span> · Due ${a.due||'Not set'} · Assigned to ${esc(a.assignee||'Samuel McKeown')}</p></div><span class="muted">${a.status||'To do'}</span></div>`}function actionsPage(){return `<main class="page"><div class="page-head"><div><h1>Actions</h1><p>Assign and track corrective work.</p></div><button class="btn primary" onclick="actionDrawer()">＋ Create action</button></div><div class="filters"><input class="search" placeholder="Search"><button class="pill">Overdue actions</button><button class="pill">Assigned to me</button><button class="pill">＋ Add filter</button></div><br><section class="card">${state.actions.length?state.actions.map(actionRow).join(''):`<div class="empty"><i>⌕</i><b>No results</b><p>Create an action or adjust your filters.</p></div>`}</section></main>`}
function reportsPage(){return `<main class="page"><div class="page-head"><div><h1>Reports</h1><p>Completed inspection reports ready to review or print.</p></div></div><section class="card">${state.inspections.length?state.inspections.map((x,i)=>`<div class="template"><div><h3>${esc(x.title)}</h3><p>${esc(x.auditor)} · ${esc(x.location)}</p></div><b class="score">${x.score}%</b><span>${x.date}</span><button class="btn" onclick="openReport(${i})">View report</button></div>`).join(''):`<div class="empty"><i>▤</i><b>No reports yet</b><p>Completed inspections appear here.</p></div>`}</section></main>`}
function pickTemplate(){showModal(`<div class="center-modal"><div class="modal-head"><h2>Which inspection do you want to start?</h2><button class="close" onclick="closeModal()">×</button></div><label class="field"><input placeholder="Search templates"></label>${templates.map(t=>`<div class="template-choice" onclick="startAudit('${t.id}')"><b>${t.name}</b><small>${t.desc}</small></div>`).join('')}</div>`)}
function actionDrawer(question=''){showModal(`<div class="drawer"><div class="modal-head"><h2>Create action</h2><button class="close" onclick="closeModal()">×</button></div><label class="field">Title<input id="acTitle" value="${esc(question)}" placeholder="Add title…"></label><label class="field">Description<textarea id="acDesc" placeholder="Add description…"></textarea></label><div class="form-grid"><label class="field">Priority<select id="acPriority"><option>Low</option><option>Medium</option><option>High</option></select></label><label class="field">Due date<input id="acDue" type="date"></label><label class="field">Repeats<select id="acRepeat"><option>Does not repeat</option><option>Weekly</option><option>Monthly</option></select></label><label class="field">Assignee<input id="acAssignee" value="Samuel McKeown"></label><label class="field">Site<select id="acSite">${sites.map(s=>`<option>${s}</option>`).join('')}</select></label><label class="field">Asset<input placeholder="Add asset"></label></div><label class="field">Labels<input id="acLabels" placeholder="Add labels"></label><div class="drawer-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createAction()">Create</button></div></div>`)}function createAction(){state.actions.unshift({title:$('#acTitle').value||'Untitled action',description:$('#acDesc').value,priority:$('#acPriority').value,due:$('#acDue').value,assignee:$('#acAssignee').value,site:$('#acSite').value,status:'To do'});save(true);closeModal();go('actions')}
function showModal(html){const m=$('#modal');m.className='modal '+(html.includes('class="drawer"')?'modal-drawer':'modal-center');m.innerHTML=html;$('#overlay').classList.remove('hidden')}function closeModal(){$('#overlay').classList.add('hidden');const m=$('#modal');m.className='modal hidden';m.innerHTML=''}
function startAudit(id){closeModal();const t=templates.find(x=>x.id===id);state.draft={template:id,title:t.name,section:0,answers:{},meta:{auditor:'Samuel McKeown',date:new Date().toISOString().slice(0,10),location:''}};state.route='audit';save();render()}
function auditPage(){const d=state.draft,g=groups[d.section],pct=Math.round(d.section/groups.length*100);return `<main class="audit"><div class="audit-top"><div><button class="link" onclick="go('inspections')">← Inspections</button><h2>${d.title}</h2></div><span>Page ${d.section+1} of ${groups.length}</span></div><div class="progress"><i style="width:${pct}%"></i></div>${d.section===0?`<div class="audit-meta"><label class="field">Auditor Name<input data-meta="auditor" value="${esc(d.meta.auditor)}"></label><label class="field">Date Conducted On<input data-meta="date" type="date" value="${d.meta.date}"></label><label class="field">Location<select data-meta="location"><option value="">Select…</option>${sites.map(s=>`<option ${d.meta.location===s?'selected':''}>${s}</option>`).join('')}</select></label></div>`:''}<div class="section-bar"><span>${g.title}</span><span>${scoreGroup(g)}%</span></div>${g.items.filter(x=>!['auditor','conducted','location'].includes(x[0])).map((q,i)=>questionCard(q,i)).join('')}<div class="audit-foot"><button class="btn" ${d.section===0?'disabled':''} onclick="auditMove(-1)">Previous page</button><button class="btn primary" onclick="auditMove(1)">${d.section===groups.length-1?'Complete inspection':'Next page'}</button></div></main>`}
function questionCard(q,i){const[id,text,type]=q,a=state.draft.answers[id]||{};if(type==='text')return `<div class="question"><h3>${text}</h3><textarea class="note" data-text="${id}" placeholder="Enter response…">${esc(a.value)}</textarea></div>`;if(type==='time')return `<div class="question"><h3>${text}</h3><input class="search" type="time" data-text="${id}" value="${a.value||''}"></div>`;return `<div class="question"><h3>${i+1}. ${text}</h3><div class="answers">${['Pass','Fail','N/A'].map(v=>`<button data-answer="${id}" data-value="${v}" class="${a.answer===v?v.replace('/','').toLowerCase():''}">${v}</button>`).join('')}</div><div class="qtools"><button data-note-toggle="${id}">▧ Add note</button><button onclick="document.getElementById('photo-${id}').click()">▧ Attach media</button><input id="photo-${id}" type="file" accept="image/*" hidden><button onclick="actionDrawer('${esc(text)}')">⚑ Create action</button></div><textarea class="note ${a.showNote?'':'hidden'}" data-note="${id}" placeholder="Add note…">${esc(a.note)}</textarea></div>`}
function bindAudit(){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{state.draft.answers[b.dataset.answer]={...(state.draft.answers[b.dataset.answer]||{}),answer:b.dataset.value};save();render()});document.querySelectorAll('[data-note-toggle]').forEach(b=>b.onclick=()=>{const a=state.draft.answers[b.dataset.noteToggle]||{};a.showNote=!a.showNote;state.draft.answers[b.dataset.noteToggle]=a;render()});document.querySelectorAll('[data-note]').forEach(x=>x.onchange=()=>{state.draft.answers[x.dataset.note]={...(state.draft.answers[x.dataset.note]||{}),note:x.value};save()});document.querySelectorAll('[data-text]').forEach(x=>x.onchange=()=>{state.draft.answers[x.dataset.text]={value:x.value};save()});document.querySelectorAll('[data-meta]').forEach(x=>x.onchange=()=>{state.draft.meta[x.dataset.meta]=x.value;save()})}function scoreGroup(g){const ids=g.items.filter(q=>!q[2]).map(q=>q[0]),p=ids.filter(id=>state.draft.answers[id]?.answer==='Pass').length,f=ids.filter(id=>state.draft.answers[id]?.answer==='Fail').length;return p+f?Math.round(p/(p+f)*100):0}function auditMove(n){if(n<0){state.draft.section--;save();render();scrollTo(0,0);return}if(state.draft.section<groups.length-1){state.draft.section++;save();render();scrollTo(0,0);return}completeAudit()}
function completeAudit(){const d=state.draft,all=groups.flatMap(g=>g.items).filter(q=>!q[2]),p=all.filter(q=>d.answers[q[0]]?.answer==='Pass').length,f=all.filter(q=>d.answers[q[0]]?.answer==='Fail').length,score=p+f?Math.round(p/(p+f)*100):0;state.inspections.unshift({title:d.title,auditor:d.meta.auditor,location:d.meta.location||'Not selected',date:d.meta.date,score,complete:true,answers:d.answers});state.draft=null;save(true);openReport(0)}function openReport(i){state.reportIndex=i;state.route='report';render();scrollTo(0,0)}
function reportPage(){const x=state.inspections[state.reportIndex];if(!x)return reportsPage();return `<main class="report"><div class="report-actions page-head"><button class="link" onclick="go('reports')">← Reports</button><button class="btn primary" onclick="print()">Download / Print PDF</button></div><section class="card report-cover"><div class="report-title"><div><img class="report-logo" src="${LOGO}" alt="Horseshoe Bay Resort"><h1>${esc(x.title)}</h1><p>${esc(x.auditor)} / ${x.date} / ${esc(x.location)}</p></div><span class="complete">Complete</span></div><div class="metrics"><div><small>Score</small><b>${x.score}%</b></div><div><small>Flagged items</small><b>${Object.values(x.answers).filter(a=>a.answer==='Fail').length}</b></div><div><small>Created actions</small><b>${state.actions.length}</b></div></div></section>${groups.map(g=>`<section class="card report-section"><h2><span>${g.title}</span><span>${reportGroupScore(g,x.answers)}%</span></h2>${g.items.map(q=>{const a=x.answers[q[0]]||{},v=a.answer||a.value||'Not answered';return `<div class="report-row"><span>${q[1]}${a.note?`<small style="display:block;color:#687182;margin-top:5px">${esc(a.note)}</small>`:''}</span><strong class="${String(a.answer||'').toLowerCase()}">${esc(v)}</strong></div>`}).join('')}</section>`).join('')}</main>`}function reportGroupScore(g,a){const ids=g.items.filter(q=>!q[2]).map(q=>q[0]),p=ids.filter(id=>a[id]?.answer==='Pass').length,f=ids.filter(id=>a[id]?.answer==='Fail').length;return p+f?Math.round(p/(p+f)*100):0}
function loginPage(){return `<div class="login-card"><img src="${LOGO}" alt="Horseshoe Bay Resort"><h1>Service Standard</h1><p>Sign in to inspections and resort operations.</p><label class="field">User<select id="loginUser">${state.users.map(u=>`<option value="${u.id}">${esc(u.name)} — ${u.role==='manager'?'Manager':'Inspector'}</option>`).join('')}</select></label><label class="field">Access code<input id="loginCode" type="password" inputmode="numeric" placeholder="Enter access code"></label><button class="btn primary" style="width:100%" onclick="login()">Sign in</button><p id="loginError" style="color:var(--red);min-height:18px"></p><div class="login-help"><b>Demo access</b><br>Manager: Samuel McKeown / 2468<br>Inspector: Inspector / 1357</div></div>`}function login(){const u=state.users.find(x=>x.id===$('#loginUser').value&&x.code===$('#loginCode').value);if(!u){$('#loginError').textContent='That access code is not correct.';return}state.session=u.id;state.route='home';save();render()}function logout(){state.session=null;save();render()}function applyRole(){const u=currentUser(),shell=$('.shell'),login=$('#loginScreen');if(!u){shell.classList.add('hidden');login.classList.remove('hidden');login.innerHTML=loginPage();return false}shell.classList.remove('hidden');login.classList.add('hidden');document.querySelectorAll('[data-manager]').forEach(x=>x.classList.toggle('hidden',!isManager()));$('#userName').textContent=u.name;$('#roleChip').textContent=u.role==='manager'?'Manager':'Inspector';$('#createBtn').textContent=isManager()?'＋ Create':'＋ Start inspection';return true}
function home(){const u=currentUser(),mine=state.actions.filter(a=>isManager()||a.assignee===u.name),open=mine.filter(a=>a.status!=='Closed').length;return `<main class="page"><div class="page-head"><div><h1>Good afternoon, ${esc(u.name.split(' ')[0])}!</h1><p>${isManager()?'Your resort operations at a glance.':'Your assigned inspections and completed reports.'}</p></div></div><section class="stats"><div class="stat"><small>Heads Up</small><b>0</b></div><div class="stat"><small>Open actions</small><b>${open}</b></div><div class="stat"><small>Inspections</small><b>${visibleInspections().length}</b></div><div class="stat"><small>Role</small><b style="font-size:18px">${isManager()?'Manager':'Inspector'}</b></div></section><section class="card agenda"><div class="page-head"><div><h1 style="font-size:18px">Agenda</h1><p>Assigned work and due dates</p></div></div>${open?mine.slice(0,4).map(actionRow).join(''):`<div class="empty"><i>🗓</i><b>All clear!</b><p>Your assigned work will appear here.</p></div>`}</section></main>`}
function visibleInspections(){const u=currentUser();return state.inspections.map((x,i)=>({...x,_i:i})).filter(x=>isManager()||!x.assignee||x.assignee===u.name||x.auditor===u.name)}function inspections(){const f=state.filters.inspections||{},rows=visibleInspections().filter(x=>(!f.search||`${x.title} ${x.auditor} ${x.location}`.toLowerCase().includes(f.search.toLowerCase()))&&(f.site==='All'||x.location===f.site)&&(f.status==='All'||(f.status==='Complete'?x.complete:!x.complete)));return `<main class="page"><div class="page-head"><div><h1>Inspections</h1><p>${rows.length} inspections available</p></div><button class="btn primary" onclick="pickTemplate()">＋ Start inspection</button></div><div class="filters"><input class="search" value="${esc(f.search||'')}" oninput="setSearch('inspections',this.value)" placeholder="Search inspections"><button class="pill ${filtersActive('inspections')?'filter-active':''}" onclick="filterDrawer('inspections')">＋ Add filter</button></div><br><table class="table"><thead><tr><th>Inspection</th><th>Location</th><th>Score</th><th>Conducted</th><th>Status</th><th></th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td><b>${esc(x.title)}</b><br><span class="muted">${esc(x.auditor)}</span></td><td>${esc(x.location)}</td><td class="score">${x.score}%</td><td>${x.date}</td><td>${x.complete?'Complete':'In progress'}</td><td><button class="link" onclick="openReport(${x._i})">View report</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty"><i>☑</i><b>No matching inspections</b><p>Start an inspection or clear the filters.</p></div></td></tr>`}</tbody></table></main>`}
function templatesPage(){const f=state.filters.templates||{},rows=templates.filter(t=>!f.search||`${t.name} ${t.desc}`.toLowerCase().includes(f.search.toLowerCase()));return `<main class="page"><div class="page-head"><div><h1>Templates</h1><p>${rows.length} published templates</p></div></div><div class="filters"><input class="search" value="${esc(f.search||'')}" oninput="setSearch('templates',this.value)" placeholder="Search all templates"><button class="pill ${filtersActive('templates')?'filter-active':''}" onclick="filterDrawer('templates')">＋ Add filter</button></div><br><section class="card">${rows.map(t=>`<div class="template"><div><h3>${t.name}</h3><p>${t.desc}</p></div><span class="muted">17 Feb 2026</span><span class="muted">All users</span><button class="btn" onclick="startAudit('${t.id}')">Start inspection</button></div>`).join('')||`<div class="empty"><b>No templates match</b></div>`}</section></main>`}
function actionsPage(){const f=state.filters.actions||{},rows=state.actions.filter(a=>(!f.search||`${a.title} ${a.description||''}`.toLowerCase().includes(f.search.toLowerCase()))&&(f.priority==='All'||a.priority===f.priority)&&(f.assignee==='All'||a.assignee===f.assignee));return `<main class="page"><div class="page-head"><div><h1>Actions</h1><p>Assign and track corrective work.</p></div><button class="btn primary" onclick="actionDrawer()">＋ Create action</button></div><div class="filters"><input class="search" value="${esc(f.search||'')}" oninput="setSearch('actions',this.value)" placeholder="Search"><button class="pill ${filtersActive('actions')?'filter-active':''}" onclick="filterDrawer('actions')">＋ Add filter</button></div><br><section class="card">${rows.length?rows.map(actionRow).join(''):`<div class="empty"><i>⌕</i><b>No results</b><p>Create an action or clear your filters.</p></div>`}</section></main>`}
function setSearch(kind,value){state.filters[kind].search=value;save();clearTimeout(window.searchTimer);window.searchTimer=setTimeout(render,120)}function filtersActive(kind){const f=state.filters[kind]||{};return Object.entries(f).some(([k,v])=>k!=='search'&&v&&v!=='All')||!!f.search}function filterDrawer(kind){const f=state.filters[kind]||{};let fields='';if(kind==='inspections')fields=`<label class="field">Location<select id="filterSite"><option>All</option>${sites.map(s=>`<option ${f.site===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="field">Status<select id="filterStatus"><option>All</option><option ${f.status==='Complete'?'selected':''}>Complete</option><option ${f.status==='In progress'?'selected':''}>In progress</option></select></label>`;if(kind==='actions')fields=`<label class="field">Priority<select id="filterPriority">${['All','Low','Medium','High'].map(v=>`<option ${f.priority===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Assignee<select id="filterAssignee"><option>All</option>${state.users.map(u=>`<option ${f.assignee===u.name?'selected':''}>${esc(u.name)}</option>`).join('')}</select></label>`;if(kind==='templates')fields=`<p class="muted">Use the template search field to filter by name or description.</p>`;showModal(`<div class="drawer"><div class="modal-head"><h2>Filter ${kind}</h2><button class="close" onclick="closeModal()">×</button></div>${fields}<div class="drawer-foot"><button class="btn" onclick="clearFilters('${kind}')">Clear</button><button class="btn primary" onclick="applyFilter('${kind}')">Apply filters</button></div></div>`)}function applyFilter(kind){if(kind==='inspections'){state.filters[kind].site=$('#filterSite').value;state.filters[kind].status=$('#filterStatus').value}if(kind==='actions'){state.filters[kind].priority=$('#filterPriority').value;state.filters[kind].assignee=$('#filterAssignee').value}save();closeModal();render()}function clearFilters(kind){state.filters[kind]={search:'',...(kind==='inspections'?{site:'All',status:'All'}:{}),...(kind==='actions'?{priority:'All',assignee:'All'}:{})};save();closeModal();render()}
function homeCreate(){if(!isManager()){pickTemplate();return}showModal(`<div class="center-modal"><div class="modal-head"><h2>Create</h2><button class="close" onclick="closeModal()">×</button></div><div class="create-choice" onclick="pickTemplate()"><b>☑</b><div><b>Start inspection</b><small class="muted" style="display:block">Choose a published audit template</small></div></div><div class="create-choice" onclick="actionDrawer()"><b>⚑</b><div><b>Create action</b><small class="muted" style="display:block">Assign corrective work to a user</small></div></div><div class="create-choice" onclick="userDrawer()"><b>♙</b><div><b>Add user</b><small class="muted" style="display:block">Create a manager or inspector login</small></div></div></div>`)}
function reportsPage(){const rows=visibleInspections().filter(x=>x.complete);return `<main class="page"><div class="page-head"><div><h1>Reports</h1><p>Completed inspection reports ready to review or print.</p></div></div><section class="card">${rows.length?rows.map(x=>`<div class="template"><div><h3>${esc(x.title)}</h3><p>${esc(x.auditor)} · ${esc(x.location)}</p></div><b class="score">${x.score}%</b><span>${x.date}</span><button class="btn" onclick="openReport(${x._i})">View report</button></div>`).join(''):`<div class="empty"><i>▤</i><b>No reports yet</b><p>Completed inspections appear here.</p></div>`}</section></main>`}
function usersPage(){return `<main class="page"><div class="page-head"><div><h1>Users & permissions</h1><p>Managers assign work; inspectors complete and view inspections.</p></div><button class="btn primary" onclick="userDrawer()">＋ Add user</button></div><section class="card">${state.users.map(u=>`<div class="template"><div><h3>${esc(u.name)}</h3><p>Access code configured</p></div><span class="badge">${u.role}</span><span class="muted">${u.id===state.session?'Current user':''}</span><button class="btn" onclick="userDrawer('${u.id}')">Edit</button></div>`).join('')}</section></main>`}function userDrawer(id=''){const u=state.users.find(x=>x.id===id)||{name:'',code:'',role:'inspector'};showModal(`<div class="drawer"><div class="modal-head"><h2>${id?'Edit':'Add'} user</h2><button class="close" onclick="closeModal()">×</button></div><input id="editUserId" type="hidden" value="${esc(id)}"><label class="field">Name<input id="editUserName" value="${esc(u.name)}"></label><label class="field">Access code<input id="editUserCode" inputmode="numeric" value="${esc(u.code)}"></label><label class="field">Permission<select id="editUserRole"><option value="inspector" ${u.role==='inspector'?'selected':''}>Inspector — fill out and view inspections</option><option value="manager" ${u.role==='manager'?'selected':''}>Manager — assign and manage</option></select></label><div class="drawer-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveUser()">Save user</button></div></div>`)}function saveUser(){const id=$('#editUserId').value,name=$('#editUserName').value.trim(),code=$('#editUserCode').value.trim(),role=$('#editUserRole').value;if(!name||!code){alert('Name and access code are required.');return}if(id){Object.assign(state.users.find(u=>u.id===id),{name,code,role})}else state.users.push({id:'user-'+Date.now(),name,code,role});save(true);closeModal();go('users')}
function actionDrawer(question=''){if(!isManager()){alert('Only managers can create and assign actions.');return}showModal(`<div class="drawer"><div class="modal-head"><h2>Create action</h2><button class="close" onclick="closeModal()">×</button></div><label class="field">Title<input id="acTitle" value="${esc(question)}" placeholder="Add title…"></label><label class="field">Description<textarea id="acDesc" placeholder="Add description…"></textarea></label><div class="form-grid"><label class="field">Priority<select id="acPriority"><option>Low</option><option>Medium</option><option>High</option></select></label><label class="field">Due date<input id="acDue" type="date"></label><label class="field">Assignee<select id="acAssignee">${state.users.map(u=>`<option>${esc(u.name)}</option>`).join('')}</select></label><label class="field">Site<select id="acSite">${sites.map(s=>`<option>${s}</option>`).join('')}</select></label></div><div class="drawer-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createAction()">Create</button></div></div>`)}
function startAudit(id){closeModal();const t=templates.find(x=>x.id===id),u=currentUser();state.draft={template:id,title:t.name,section:0,answers:{},meta:{auditor:u.name,date:new Date().toISOString().slice(0,10),location:''},assignee:u.name};state.route='audit';save();render()}
function completeAudit(){const d=state.draft,all=groups.flatMap(g=>g.items).filter(q=>!q[2]),p=all.filter(q=>d.answers[q[0]]?.answer==='Pass').length,f=all.filter(q=>d.answers[q[0]]?.answer==='Fail').length,score=p+f?Math.round(p/(p+f)*100):0;state.inspections.unshift({title:d.title,auditor:d.meta.auditor,assignee:d.assignee,location:d.meta.location||'Not selected',date:d.meta.date,score,complete:true,answers:d.answers});state.draft=null;state.reportIndex=0;state.route='complete';save(true);render();scrollTo(0,0)}function completionPage(){const x=state.inspections[state.reportIndex];return `<main class="completion"><section class="card hero"><i>✓</i><h1>Inspection complete</h1><p class="muted">${esc(x.title)} · ${esc(x.location)} · Score ${x.score}%</p></section><section class="completion-actions"><button class="btn primary" onclick="saveCompleted()">Save document</button><button class="btn" onclick="exportInspection()">Export document</button><button class="btn" onclick="emailInspection()">Email document</button><button class="btn" onclick="printReport()">Print / Save PDF</button></section><div style="text-align:center;margin-top:20px"><button class="link" onclick="openReport(${state.reportIndex})">View completed report</button> · <button class="link" onclick="go('inspections')">Back to inspections</button></div></main>`}function saveCompleted(){save(true);setTimeout(()=>go('reports'),650)}function exportInspection(){const x=state.inspections[state.reportIndex],html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(x.title)}</title><style>body{font:14px Arial;max-width:850px;margin:30px auto;color:#202633}img{width:220px}h2{background:#eef0f5;padding:10px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:9px}</style></head><body><img src="${LOGO}"><h1>${esc(x.title)}</h1><p>${esc(x.auditor)} · ${x.date} · ${esc(x.location)} · Score ${x.score}%</p>${groups.map(g=>`<h2>${g.title}</h2>${g.items.map(q=>{const a=x.answers[q[0]]||{};return `<div class="row"><span>${esc(q[1])}</span><b>${esc(a.answer||a.value||'Not answered')}</b></div>`}).join('')}`).join('')}</body></html>`,blob=new Blob([html],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=x.title.replace(/[^a-z0-9]+/gi,'-')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function emailInspection(){const x=state.inspections[state.reportIndex],subject=encodeURIComponent(`Completed audit: ${x.title}`),body=encodeURIComponent(`Horseshoe Bay Resort audit completed.\n\n${x.title}\nAuditor: ${x.auditor}\nLocation: ${x.location}\nDate: ${x.date}\nScore: ${x.score}%\n\nUse Export document to attach the full audit.`);location.href=`mailto:?subject=${subject}&body=${body}`}function printReport(){state.route='report';render();setTimeout(()=>print(),100)}
function reportButtons(){return `<div class="filters"><button class="btn" onclick="saveCompleted()">Save</button><button class="btn" onclick="exportInspection()">Export</button><button class="btn" onclick="emailInspection()">Email</button><button class="btn primary" onclick="print()">Print / Save PDF</button></div>`}function reportPage(){const x=state.inspections[state.reportIndex];if(!x)return reportsPage();return `<main class="report"><div class="report-actions page-head"><button class="link" onclick="go('reports')">← Reports</button>${reportButtons()}</div><section class="card report-cover"><div class="report-title"><div><img class="report-logo" src="${LOGO}" alt="Horseshoe Bay Resort"><h1>${esc(x.title)}</h1><p>${esc(x.auditor)} / ${x.date} / ${esc(x.location)}</p></div><span class="complete">Complete</span></div><div class="metrics"><div><small>Score</small><b>${x.score}%</b></div><div><small>Flagged items</small><b>${Object.values(x.answers).filter(a=>a.answer==='Fail').length}</b></div><div><small>Created actions</small><b>${state.actions.length}</b></div></div></section>${groups.map(g=>`<section class="card report-section"><h2><span>${g.title}</span><span>${reportGroupScore(g,x.answers)}%</span></h2>${g.items.map(q=>{const a=x.answers[q[0]]||{},v=a.answer||a.value||'Not answered';return `<div class="report-row"><span>${q[1]}${a.note?`<small style="display:block;color:#687182;margin-top:5px">${esc(a.note)}</small>`:''}</span><strong class="${String(a.answer||'').toLowerCase()}">${esc(v)}</strong></div>`}).join('')}</section>`).join('')}</main>`}
function render(){if(!applyRole())return;const u=currentUser();if(['actions','templates','users'].includes(state.route)&&!isManager())state.route='inspections';document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('on',b.dataset.route===state.route));const v=$('#view');if(state.route==='home')v.innerHTML=home();else if(state.route==='inspections')v.innerHTML=inspections();else if(state.route==='templates')v.innerHTML=templatesPage();else if(state.route==='actions')v.innerHTML=actionsPage();else if(state.route==='reports')v.innerHTML=reportsPage();else if(state.route==='users')v.innerHTML=usersPage();else if(state.route==='audit'){v.innerHTML=auditPage();bindAudit()}else if(state.route==='complete')v.innerHTML=completionPage();else if(state.route==='report')v.innerHTML=reportPage()}document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>go(b.dataset.route));$('#createBtn').onclick=homeCreate;$('#globalSearch').onkeydown=e=>{if(e.key==='Enter'){state.filters.inspections.search=e.target.value;go('inspections')}};$('#overlay').onclick=closeModal;render();
document.title='Service Standard · Build 8';
</script></body></html>
