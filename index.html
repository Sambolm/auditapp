<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5146d8"><title>Service Standard</title><style>
:root{--p:#5146d8;--pd:#4036bd;--ink:#202633;--muted:#687182;--line:#e1e4eb;--bg:#f7f8fb;--green:#07875c;--red:#d3424c;--amber:#b96f00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}.hidden{display:none!important}.shell{min-height:100vh}.rail{position:fixed;inset:0 auto 0 0;width:220px;background:#fff;border-right:1px solid var(--line);z-index:30;display:flex;flex-direction:column}.logo{height:68px;display:flex;align-items:center;gap:11px;padding:0 18px;border-bottom:1px solid var(--line)}.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#7569ed,#4235c4);color:#fff;font-style:normal;font-weight:900}.logo b{font-size:15px}.logo small{display:block;color:var(--muted);font-size:10px}.nav{padding:12px 8px}.nav button{border:0;background:transparent;width:100%;padding:11px 12px;border-radius:8px;text-align:left;color:#424a58;margin:2px 0;cursor:pointer}.nav button.on{background:#ebe9ff;color:var(--p);font-weight:800}.nav button span{display:inline-block;width:24px}.user{margin-top:auto;padding:15px 18px;border-top:1px solid var(--line);font-size:12px}.user small{display:block;color:var(--muted);margin-top:3px}.stage{margin-left:220px}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.search{width:min(420px,45vw);border:1px solid var(--line);background:#fafbfc;border-radius:8px;padding:10px 13px}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}.primary{background:var(--p);border-color:var(--p);color:#fff}.primary:hover{background:var(--pd)}.page{max-width:1160px;margin:auto;padding:30px}.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.page-head h1{margin:0;font-size:25px}.page-head p{margin:6px 0 0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:12px}.stat{padding:18px}.stat small{color:var(--muted)}.stat b{display:block;font-size:28px;margin-top:8px}.agenda{margin-top:22px;padding:20px}.tabs,.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 11px;cursor:pointer}.pill.on{border-color:var(--p);background:#eeecff;color:var(--p)}.empty{text-align:center;padding:58px;color:var(--muted)}.empty i{display:block;font-size:48px;font-style:normal}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.table th,.table td{text-align:left;padding:13px 14px;border-bottom:1px solid #edf0f4;font-size:12px}.table th{color:var(--muted);font-weight:600;background:#fbfbfd}.score{font-weight:800;color:var(--green)}.muted{color:var(--muted)}.link{border:0;background:transparent;color:var(--p);font-weight:700;cursor:pointer}.template{display:grid;grid-template-columns:1fr 120px 100px 130px;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #edf0f4}.template h3{font-size:13px;margin:0}.template p{font-size:11px;color:var(--muted);margin:4px 0 0}.action{padding:15px;border-bottom:1px solid #edf0f4;display:grid;grid-template-columns:1fr auto;gap:12px}.action h3{font-size:13px;margin:0}.action p{font-size:11px;color:var(--muted)}.badge{display:inline-block;border-radius:6px;padding:4px 7px;background:#eef0f5;color:#596273;font-size:10px}.badge.low{background:#e7f7f0;color:#087451}.badge.high{background:#fdebed;color:#b52f38}.backdrop{position:fixed;inset:0;background:#12172599;z-index:50}.modal{position:fixed;z-index:60;background:#fff;border-radius:14px;box-shadow:0 20px 60px #0003}.center-modal{width:min(520px,calc(100vw - 28px));left:50%;top:50%;transform:translate(-50%,-50%);padding:20px}.drawer{inset:0 0 0 auto;width:min(440px,95vw);border-radius:0;padding:22px;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{font-size:16px;margin:0}.close{border:0;background:transparent;font-size:20px;cursor:pointer}.template-choice{padding:12px;border:1px solid var(--line);border-radius:9px;margin:8px 0;cursor:pointer}.template-choice:hover{border-color:var(--p);background:#f5f4ff}.template-choice b,.template-choice small{display:block}.template-choice small{color:var(--muted);margin-top:4px}.field{display:block;color:var(--muted);font-size:11px;font-weight:700;margin:15px 0}.field input,.field textarea,.field select{display:block;width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:6px;background:#fff}.field textarea{min-height:78px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.drawer-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.audit{max-width:880px;margin:auto;padding:25px}.audit-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.progress{height:7px;background:#e5e7ee;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--p)}.audit-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:18px 0}.section-bar{background:var(--p);color:#fff;padding:12px 15px;border-radius:9px;margin:18px 0 10px;display:flex;justify-content:space-between;font-weight:800}.question{background:#fff;border:1px solid var(--line);border-left:3px solid #e2e4ea;border-radius:10px;padding:16px;margin:10px 0}.question h3{font-size:13px;line-height:1.5;margin:0 0 13px}.answers{display:flex;gap:8px}.answers button{flex:1;border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px;font-weight:700;cursor:pointer}.answers .pass{background:#e7f7f0;border-color:#63b994;color:#087451}.answers .fail{background:#fdebed;border-color:#e58e94;color:#b52f38}.answers .na{background:#efedff;border-color:#9a91ea;color:#4a3cc4}.qtools{display:flex;gap:14px;margin-top:12px}.qtools button{border:0;background:transparent;color:var(--p);font-size:11px;cursor:pointer}.note{width:100%;min-height:62px;border:1px solid var(--line);border-radius:7px;padding:9px;margin-top:10px}.audit-foot{display:flex;justify-content:space-between;margin:20px 0}.report{max-width:860px;margin:auto;padding:28px}.report-cover{padding:28px}.report-title{display:flex;justify-content:space-between}.report-title h1{margin:6px 0}.complete{color:var(--green);font-weight:800}.metrics{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin:20px 0}.metrics div{padding:15px;border-right:1px solid var(--line)}.metrics small{display:block;color:var(--muted)}.metrics b{font-size:21px}.report-section{margin-top:15px}.report-section h2{margin:0;background:#eff1f7;padding:13px;font-size:16px;display:flex;justify-content:space-between}.report-row{display:flex;justify-content:space-between;gap:15px;padding:13px;border-top:1px solid #edf0f4;font-size:12px}.report-row strong.pass{color:var(--green)}.report-row strong.fail{color:var(--red)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#202633;color:#fff;padding:10px 15px;border-radius:8px;z-index:100;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(max-width:760px){.rail{width:68px}.logo{padding:0 15px}.logo div,.nav button:not(.on){font-size:0}.nav button span{font-size:18px}.nav button.on{font-size:0}.user{font-size:0}.stage{margin-left:68px}.top{padding:0 12px}.search{width:44vw}.page{padding:18px}.stats{grid-template-columns:1fr 1fr}.template{grid-template-columns:1fr auto}.template>:nth-child(2),.template>:nth-child(3){display:none}.audit-meta,.form-grid{grid-template-columns:1fr}.answers{flex-wrap:wrap}.metrics{grid-template-columns:1fr}.metrics div{border-bottom:1px solid var(--line)}}@media print{.rail,.top,.report-actions{display:none}.stage{margin:0}.report{padding:0}.card{break-inside:avoid}}
</style></head><body><div class="shell"><aside class="rail"><div class="logo"><i>✓</i><div><b>Service Standard</b><small>Hospitality excellence</small></div></div><nav class="nav"><button data-route="home" class="on"><span>⌂</span> Home</button><button data-route="inspections"><span>☑</span> Inspections</button><button data-route="actions"><span>⚑</span> Actions</button><button data-route="templates"><span>▦</span> Templates</button><button data-route="reports"><span>▤</span> Reports</button></nav><div class="user"><b>Samuel McKeown</b><small>Horseshoe Bay Resort</small></div></aside><div class="stage"><header class="top"><input class="search" id="globalSearch" placeholder="Search"><button class="btn primary" id="createBtn">＋ Create</button></header><div id="view"></div></div></div><div id="overlay" class="backdrop hidden"></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast">Saved on this device</div><script>
const sites=["J's Restaurant & Bar","Whitewater 360 Sports Bar","Slick Rock Bar & Grill","Cap Rock Cabana","Yacht Club","Cap Rock Restaurant","Waterfront"];
const templates=[{id:'breakfast',name:'Restaurant Audit - Breakfast',desc:'Audit restaurant service using Forbes Standards as a benchmark.',pages:4},{id:'lunch',name:'Restaurant Audit - Lunch/Dinner',desc:'Audit restaurant service using Forbes Standards as a benchmark.',pages:4},{id:'pool',name:'Pool Audit',desc:'Audit cleanliness, safety, and overall guest experience and satisfaction.',pages:2},{id:'public',name:'Public Space Audit',desc:'Audit cleanliness, safety, and overall guest experience and satisfaction.',pages:2},{id:'room',name:'Hotel Room Audit',desc:'Inspect a randomly selected guest room and front desk preparation.',pages:3},{id:'dining',name:'In-Room Dining Audit',desc:'Audit cleanliness, safety, and overall guest experience.',pages:3}];
const groups=[{title:'Auditor Information',items:[['auditor','Auditor Name','text'],['conducted','Date Conducted On','date'],['location','Location','site']]},{title:'Host Greeting and Initial Service',items:[['arrival','Arrival Time','time'],['h1','Host or staff is present when the guest arrives and greets the guest at the entrance'],['h2','Were you greeted in a warm and friendly manner?'],['h3','If a reservation was made, were the reservation details accurate?'],['h4','If a reservation was made, was your table ready within five minutes?'],['h5','If waiting was required, were you given an estimated waiting time?'],['h6','Were you fully escorted to your seat?']]},{title:'Server Greeting and Initial Service',items:[['s1','Were you greeted by the server within one minute of being seated?'],['s2','Did the server greet you with a warm and genuine tone?'],['s3','Did the server avoid slang and phrase fragments?'],['s4','Did the server smile and maintain eye contact?']]},{title:'Beverage Service',items:[['b1','Were you offered three choices of water?'],['b2','Did the server make a thoughtful beverage suggestion?'],['b3','Were beverages served within seven minutes?'],['b4','Were refills offered before the glass was empty?'],['b5','Were beverages visually appealing and properly prepared?']]},{title:'Dining Experience',items:[['d1','Did the server explain the menu and highlight specials?'],['d2','Did the server inquire about dietary restrictions or allergies?'],['d3','Did the server offer thoughtful recommendations?'],['d4','Could the server describe preparation methods and ingredients?'],['d5','Were dishes served in the appropriate order?'],['d6','Did associates display anticipatory service?']]},{title:'Food Quality',items:[['f1','Did the food provide varying contrasts of texture?'],['f2','Were food items served at the appropriate temperature?'],['f3','Was the flavor balanced appropriately?'],['f4','Were portion sizes appropriate?'],['f5','Was the presentation photogenic and dynamically interesting?']]},{title:'Associate Engagement and Service',items:[['a1','Did the server check back within two bites or two minutes?'],['a2','Did the server maintain an appropriate pace?'],['a3','Did the server show genuine concern for guest satisfaction?']]},{title:'Table Maintenance and Ambiance',items:[['t1','Was appropriate cutlery provided?'],['t2','Was the table cleared at an appropriate pace?'],['t3','Was the table maintained unobtrusively?'],['t4','Was music appropriate in style and volume?'],['t5','Was the restaurant temperature appropriate?']]},{title:'Departure',items:[['dp1','Did the server avoid making you feel rushed?'],['dp2','Did the server offer an appropriate closing remark?'],['dp3','Was the bill accurate and timely?'],['dp4','Could the server answer questions about the resort?']]},{title:'Facilities',items:[['fac1','Dishes, cutlery, and glassware were clean and free of damage.'],['fac2','Menus, tables, chairs, and service stations were clean and orderly.'],['fac3','Lighting, floors, walls, ceilings, and windows were maintained.']]},{title:'Overall Associate Professionalism',items:[['p1','Associates maintained attentive and available posture.'],['p2','Associates spoke clearly and professionally.'],['p3','Managers remained visible and attentive.'],['p4','No associate cell phone was visible or used.']]},{title:'Review',items:[['review','How was your overall experience?','text'],['exceptional','Were there associates who showed exceptional service?','text']]}];
const KEY='serviceStandardPlatformV2';let state={route:'home',actions:[],inspections:[],draft:null};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(show=false){localStorage.setItem(KEY,JSON.stringify(state));if(show){$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),900)}}function go(route){state.route=route;save();document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('on',b.dataset.route===route));render();scrollTo(0,0)}
function home(){const open=state.actions.filter(a=>a.status!=='Closed').length;return `<main class="page"><div class="page-head"><div><h1>Good afternoon, Sam!</h1><p>Your resort operations at a glance.</p></div></div><section class="stats"><div class="stat"><small>Heads Up</small><b>0</b></div><div class="stat"><small>Open actions</small><b>${open}</b></div><div class="stat"><small>Inspections</small><b>${state.inspections.length}</b></div><div class="stat"><small>Templates</small><b>${templates.length}</b></div></section><section class="card agenda"><div class="page-head"><div><h1 style="font-size:18px">Agenda</h1><p>Scheduled items and due dates assigned to you</p></div></div><div class="tabs"><button class="pill on">All</button><button class="pill">Inspections</button><button class="pill">Actions</button><button class="pill">Issues</button><button class="pill">Training</button></div>${open?state.actions.slice(0,4).map(actionRow).join(''):`<div class="empty"><i>🗓</i><b>All clear!</b><p>Your assigned work will appear here.</p></div>`}</section></main>`}
function inspections(){return `<main class="page"><div class="page-head"><div><h1>Inspections</h1><p>${state.inspections.length} saved inspections</p></div><button class="btn primary" onclick="pickTemplate()">＋ Start inspection</button></div><div class="filters"><input class="search" placeholder="Search inspections"><button class="pill">＋ Add filter</button></div><br><table class="table"><thead><tr><th>Inspection</th><th>Location</th><th>Score</th><th>Conducted</th><th>Completed</th><th></th></tr></thead><tbody>${state.inspections.length?state.inspections.map((x,i)=>`<tr><td><b>${esc(x.title)}</b><br><span class="muted">${esc(x.auditor)}</span></td><td>${esc(x.location)}</td><td class="score">${x.score}%</td><td>${x.date}</td><td>${x.complete?'Complete':'In progress'}</td><td><button class="link" onclick="openReport(${i})">View report</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty"><i>☑</i><b>No inspections yet</b><p>Start an inspection from one of your templates.</p></div></td></tr>`}</tbody></table></main>`}
function templatesPage(){return `<main class="page"><div class="page-head"><div><h1>Templates</h1><p>${templates.length} published templates</p></div></div><div class="filters"><input class="search" placeholder="Search all templates"><button class="pill">＋ Add filter</button></div><br><section class="card">${templates.map(t=>`<div class="template"><div><h3>${t.name}</h3><p>${t.desc}</p></div><span class="muted">17 Feb 2026</span><span class="muted">All users</span><button class="btn" onclick="startAudit('${t.id}')">Start inspection</button></div>`).join('')}</section></main>`}
function actionRow(a){return `<div class="action"><div><h3>⚑ ${esc(a.title)}</h3><p><span class="badge ${a.priority.toLowerCase()}">${a.priority}</span> · Due ${a.due||'Not set'} · Assigned to ${esc(a.assignee||'Samuel McKeown')}</p></div><span class="muted">${a.status||'To do'}</span></div>`}function actionsPage(){return `<main class="page"><div class="page-head"><div><h1>Actions</h1><p>Assign and track corrective work.</p></div><button class="btn primary" onclick="actionDrawer()">＋ Create action</button></div><div class="filters"><input class="search" placeholder="Search"><button class="pill">Overdue actions</button><button class="pill">Assigned to me</button><button class="pill">＋ Add filter</button></div><br><section class="card">${state.actions.length?state.actions.map(actionRow).join(''):`<div class="empty"><i>⌕</i><b>No results</b><p>Create an action or adjust your filters.</p></div>`}</section></main>`}
function reportsPage(){return `<main class="page"><div class="page-head"><div><h1>Reports</h1><p>Completed inspection reports ready to review or print.</p></div></div><section class="card">${state.inspections.length?state.inspections.map((x,i)=>`<div class="template"><div><h3>${esc(x.title)}</h3><p>${esc(x.auditor)} · ${esc(x.location)}</p></div><b class="score">${x.score}%</b><span>${x.date}</span><button class="btn" onclick="openReport(${i})">View report</button></div>`).join(''):`<div class="empty"><i>▤</i><b>No reports yet</b><p>Completed inspections appear here.</p></div>`}</section></main>`}
function pickTemplate(){showModal(`<div class="center-modal"><div class="modal-head"><h2>Which inspection do you want to start?</h2><button class="close" onclick="closeModal()">×</button></div><label class="field"><input placeholder="Search templates"></label>${templates.map(t=>`<div class="template-choice" onclick="startAudit('${t.id}')"><b>${t.name}</b><small>${t.desc}</small></div>`).join('')}</div>`)}
function actionDrawer(question=''){showModal(`<div class="drawer"><div class="modal-head"><h2>Create action</h2><button class="close" onclick="closeModal()">×</button></div><label class="field">Title<input id="acTitle" value="${esc(question)}" placeholder="Add title…"></label><label class="field">Description<textarea id="acDesc" placeholder="Add description…"></textarea></label><div class="form-grid"><label class="field">Priority<select id="acPriority"><option>Low</option><option>Medium</option><option>High</option></select></label><label class="field">Due date<input id="acDue" type="date"></label><label class="field">Repeats<select id="acRepeat"><option>Does not repeat</option><option>Weekly</option><option>Monthly</option></select></label><label class="field">Assignee<input id="acAssignee" value="Samuel McKeown"></label><label class="field">Site<select id="acSite">${sites.map(s=>`<option>${s}</option>`).join('')}</select></label><label class="field">Asset<input placeholder="Add asset"></label></div><label class="field">Labels<input id="acLabels" placeholder="Add labels"></label><div class="drawer-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createAction()">Create</button></div></div>`)}function createAction(){state.actions.unshift({title:$('#acTitle').value||'Untitled action',description:$('#acDesc').value,priority:$('#acPriority').value,due:$('#acDue').value,assignee:$('#acAssignee').value,site:$('#acSite').value,status:'To do'});save(true);closeModal();go('actions')}
function showModal(html){$('#overlay').classList.remove('hidden');$('#modal').classList.remove('hidden');$('#modal').innerHTML=html}function closeModal(){$('#overlay').classList.add('hidden');$('#modal').classList.add('hidden');$('#modal').innerHTML=''}
function startAudit(id){closeModal();const t=templates.find(x=>x.id===id);state.draft={template:id,title:t.name,section:0,answers:{},meta:{auditor:'Samuel McKeown',date:new Date().toISOString().slice(0,10),location:''}};state.route='audit';save();render()}
function auditPage(){const d=state.draft,g=groups[d.section],pct=Math.round(d.section/groups.length*100);return `<main class="audit"><div class="audit-top"><div><button class="link" onclick="go('inspections')">← Inspections</button><h2>${d.title}</h2></div><span>Page ${d.section+1} of ${groups.length}</span></div><div class="progress"><i style="width:${pct}%"></i></div>${d.section===0?`<div class="audit-meta"><label class="field">Auditor Name<input data-meta="auditor" value="${esc(d.meta.auditor)}"></label><label class="field">Date Conducted On<input data-meta="date" type="date" value="${d.meta.date}"></label><label class="field">Location<select data-meta="location"><option value="">Select…</option>${sites.map(s=>`<option ${d.meta.location===s?'selected':''}>${s}</option>`).join('')}</select></label></div>`:''}<div class="section-bar"><span>${g.title}</span><span>${scoreGroup(g)}%</span></div>${g.items.filter(x=>!['auditor','conducted','location'].includes(x[0])).map((q,i)=>questionCard(q,i)).join('')}<div class="audit-foot"><button class="btn" ${d.section===0?'disabled':''} onclick="auditMove(-1)">Previous page</button><button class="btn primary" onclick="auditMove(1)">${d.section===groups.length-1?'Complete inspection':'Next page'}</button></div></main>`}
function questionCard(q,i){const[id,text,type]=q,a=state.draft.answers[id]||{};if(type==='text')return `<div class="question"><h3>${text}</h3><textarea class="note" data-text="${id}" placeholder="Enter response…">${esc(a.value)}</textarea></div>`;if(type==='time')return `<div class="question"><h3>${text}</h3><input class="search" type="time" data-text="${id}" value="${a.value||''}"></div>`;return `<div class="question"><h3>${i+1}. ${text}</h3><div class="answers">${['Pass','Fail','N/A'].map(v=>`<button data-answer="${id}" data-value="${v}" class="${a.answer===v?v.replace('/','').toLowerCase():''}">${v}</button>`).join('')}</div><div class="qtools"><button data-note-toggle="${id}">▧ Add note</button><button onclick="document.getElementById('photo-${id}').click()">▧ Attach media</button><input id="photo-${id}" type="file" accept="image/*" hidden><button onclick="actionDrawer('${esc(text)}')">⚑ Create action</button></div><textarea class="note ${a.showNote?'':'hidden'}" data-note="${id}" placeholder="Add note…">${esc(a.note)}</textarea></div>`}
function bindAudit(){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{state.draft.answers[b.dataset.answer]={...(state.draft.answers[b.dataset.answer]||{}),answer:b.dataset.value};save();render()});document.querySelectorAll('[data-note-toggle]').forEach(b=>b.onclick=()=>{const a=state.draft.answers[b.dataset.noteToggle]||{};a.showNote=!a.showNote;state.draft.answers[b.dataset.noteToggle]=a;render()});document.querySelectorAll('[data-note]').forEach(x=>x.onchange=()=>{state.draft.answers[x.dataset.note]={...(state.draft.answers[x.dataset.note]||{}),note:x.value};save()});document.querySelectorAll('[data-text]').forEach(x=>x.onchange=()=>{state.draft.answers[x.dataset.text]={value:x.value};save()});document.querySelectorAll('[data-meta]').forEach(x=>x.onchange=()=>{state.draft.meta[x.dataset.meta]=x.value;save()})}function scoreGroup(g){const ids=g.items.filter(q=>!q[2]).map(q=>q[0]),p=ids.filter(id=>state.draft.answers[id]?.answer==='Pass').length,f=ids.filter(id=>state.draft.answers[id]?.answer==='Fail').length;return p+f?Math.round(p/(p+f)*100):0}function auditMove(n){if(n<0){state.draft.section--;save();render();scrollTo(0,0);return}if(state.draft.section<groups.length-1){state.draft.section++;save();render();scrollTo(0,0);return}completeAudit()}
function completeAudit(){const d=state.draft,all=groups.flatMap(g=>g.items).filter(q=>!q[2]),p=all.filter(q=>d.answers[q[0]]?.answer==='Pass').length,f=all.filter(q=>d.answers[q[0]]?.answer==='Fail').length,score=p+f?Math.round(p/(p+f)*100):0;state.inspections.unshift({title:d.title,auditor:d.meta.auditor,location:d.meta.location||'Not selected',date:d.meta.date,score,complete:true,answers:d.answers});state.draft=null;save(true);openReport(0)}function openReport(i){state.reportIndex=i;state.route='report';render();scrollTo(0,0)}
function reportPage(){const x=state.inspections[state.reportIndex];if(!x)return reportsPage();return `<main class="report"><div class="report-actions page-head"><button class="link" onclick="go('reports')">← Reports</button><button class="btn primary" onclick="print()">Download / Print PDF</button></div><section class="card report-cover"><div class="report-title"><div><span class="muted">HORSESHOE BAY RESORT</span><h1>${esc(x.title)}</h1><p>${esc(x.auditor)} / ${x.date} / ${esc(x.location)}</p></div><span class="complete">Complete</span></div><div class="metrics"><div><small>Score</small><b>${x.score}%</b></div><div><small>Flagged items</small><b>${Object.values(x.answers).filter(a=>a.answer==='Fail').length}</b></div><div><small>Created actions</small><b>${state.actions.length}</b></div></div></section>${groups.map(g=>`<section class="card report-section"><h2><span>${g.title}</span><span>${reportGroupScore(g,x.answers)}%</span></h2>${g.items.map(q=>{const a=x.answers[q[0]]||{},v=a.answer||a.value||'Not answered';return `<div class="report-row"><span>${q[1]}${a.note?`<small style="display:block;color:#687182;margin-top:5px">${esc(a.note)}</small>`:''}</span><strong class="${String(a.answer||'').toLowerCase()}">${esc(v)}</strong></div>`}).join('')}</section>`).join('')}</main>`}function reportGroupScore(g,a){const ids=g.items.filter(q=>!q[2]).map(q=>q[0]),p=ids.filter(id=>a[id]?.answer==='Pass').length,f=ids.filter(id=>a[id]?.answer==='Fail').length;return p+f?Math.round(p/(p+f)*100):0}
function render(){const v=$('#view');if(state.route==='home')v.innerHTML=home();else if(state.route==='inspections')v.innerHTML=inspections();else if(state.route==='templates')v.innerHTML=templatesPage();else if(state.route==='actions')v.innerHTML=actionsPage();else if(state.route==='reports')v.innerHTML=reportsPage();else if(state.route==='audit'){v.innerHTML=auditPage();bindAudit()}else if(state.route==='report')v.innerHTML=reportPage()}document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>go(b.dataset.route));$('#createBtn').onclick=pickTemplate;$('#overlay').onclick=closeModal;render();
</script></body></html>
