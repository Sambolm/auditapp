<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6657df"><title>Restaurant Audit</title><style>
:root{--ink:#18202d;--muted:#687386;--line:#dfe4ec;--purple:#6657df;--green:#17875f;--red:#d84d54}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f7f8fb;color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:20}.brand,.actions,.next,.tools{display:flex;gap:10px;align-items:center}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;color:#fff;background:linear-gradient(145deg,#7769ed,#5545cc);font-size:22px;font-weight:800}.brand b,.brand small{display:block}.brand small{font-size:12px;color:var(--muted)}button{font:inherit;cursor:pointer}.primary,.ghost{border-radius:10px;padding:10px 16px;font-weight:700}.primary{border:0;background:var(--purple);color:#fff}.ghost{border:1px solid var(--line);background:#fff}.work{display:grid;grid-template-columns:280px minmax(0,820px);gap:32px;max-width:1180px;margin:auto;padding:32px}.side{position:sticky;top:104px;height:calc(100vh - 130px);overflow:auto}.side>p{font-size:12px;color:var(--muted)}.bar{height:6px;background:#e1e5ed;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--purple)}.group{text-transform:uppercase;letter-spacing:.12em;color:#8b93a2;font-size:11px;font-weight:800;margin:20px 10px 7px}.nav{width:100%;display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:transparent;padding:10px;border-radius:10px;color:#596375;font-size:13px}.nav.on{background:#eceafd;color:#4e40c0;font-weight:800}.nav em{font-style:normal;font-size:11px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:var(--purple);font-weight:800;font-size:11px}.heading h1,.report-title h1{font-size:30px;line-height:1.15;margin:7px 0 0}.heading>span{color:var(--muted);font-size:12px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.meta label{font-size:11px;text-transform:capitalize;color:var(--muted);font-weight:700}.meta input,.wide,textarea{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px;color:var(--ink);font:inherit}textarea{min-height:86px;resize:vertical}.questions{display:flex;flex-direction:column;gap:14px}.question{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 6px 20px #191f2d09}.question.flagged{border-color:#eaa73e;box-shadow:inset 4px 0 #eaa73e}.qtitle{display:grid;grid-template-columns:28px 1fr 30px;gap:8px}.qtitle>span{display:grid;place-items:center;width:26px;height:26px;background:#f0effd;color:#5648cb;border-radius:8px;font-weight:800;font-size:12px}.qtitle h2{font-size:15px;line-height:1.45;margin:2px 0 16px}.flag{border:0;background:transparent;color:#d58b20;font-size:19px}.choices{display:flex;gap:9px}.choices button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 18px;font-weight:700;color:#647083}.choices .pass{background:#e6f6ef;border-color:#54ae89;color:#137450}.choices .fail{background:#fdebec;border-color:#e5878b;color:#ba343b}.choices .na,.rating .selected{background:#eeecfd;border-color:#8d81e7;color:#5142c6}.rating button{width:44px;height:42px;padding:0}.question details{margin-top:14px;border-top:1px solid #edf0f4;padding-top:12px}.question summary{color:var(--muted);font-size:12px;font-weight:700}.upload{display:flex;min-height:130px;border:1.5px dashed #bfc5d2;border-radius:12px;align-items:center;justify-content:center;flex-direction:column;color:var(--purple);overflow:hidden}.upload small{color:var(--muted)}.upload input{display:none}.upload img{width:100%;max-height:320px;object-fit:cover}.next{justify-content:space-between;margin:24px 0 50px}.report-shell{display:grid;grid-template-columns:230px minmax(0,760px);gap:32px;max-width:1090px;margin:auto;padding:28px}.report-nav{position:sticky;top:100px;height:calc(100vh - 120px);overflow:auto}.report-nav a{display:block;color:#586275;text-decoration:none;font-size:13px;padding:8px 12px;border-left:2px solid #e2e5ec}.tools{justify-content:flex-end;margin-bottom:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden}.overview{padding:24px}.report-title{display:flex;justify-content:space-between}.report-title p{color:var(--muted)}.ring{width:96px;height:96px;border:9px solid #69b996;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring.low{border-color:#e48b8f}.ring b{font-size:22px}.ring small,.metrics small,.details small{display:block;color:var(--muted)}.metrics,.details{display:grid;grid-template-columns:repeat(3,1fr)}.metrics{border:1px solid var(--line);border-radius:12px;margin:24px 0;overflow:hidden}.metrics div{padding:16px;border-right:1px solid var(--line)}.metrics b{font-size:21px}.details{gap:12px}.details p{background:#f3f5fb;border-radius:10px;padding:13px;margin:0}.section-head{background:#eff1f8;padding:16px 18px;display:flex;justify-content:space-between}.section-head h2{margin:0;font-size:17px}.answer{padding:16px 18px;border-top:1px solid #edf0f4;display:flex;justify-content:space-between;gap:22px}.answer p{font-size:13px;line-height:1.45;margin:0}.answer small{display:block;color:var(--muted);margin-top:7px}.answer .action-note{color:#9d6516}.answer strong{font-size:12px;color:#6b7483;white-space:nowrap}.answer strong.pass{color:var(--green)}.answer strong.fail{color:var(--red)}.answer img{width:150px;height:100px;object-fit:cover;border-radius:8px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#18202d;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(max-width:800px){.top{padding:0 12px}.brand small{display:none}.ghost{padding:9px 10px}.work,.report-shell{display:block;padding:16px}.side,.report-nav{position:static;height:auto;display:flex;overflow-x:auto;gap:6px;padding-bottom:10px;margin-bottom:16px}.side>p,.group{display:none}.nav{min-width:180px;background:#fff;border:1px solid var(--line)}.heading h1{font-size:24px}.heading>span{display:none}.meta{grid-template-columns:1fr}.choices button{flex:1;padding:9px 8px}.report-nav a{min-width:max-content;border-left:0;border-bottom:2px solid #e2e5ec}.ring{width:74px;height:74px;border-width:7px}.metrics,.details{grid-template-columns:1fr}.metrics div{border-right:0;border-bottom:1px solid var(--line)}}
@media print{.top,.report-nav,.tools{display:none!important}.report-shell{display:block;max-width:none;padding:0}.card{break-inside:avoid}.overview{break-after:page}body{background:#fff}}
</style></head><body><header class="top"><div class="brand"><span class="mark">✓</span><div><b>Service Standard</b><small>Restaurant inspection</small></div></div><div class="actions"><button class="ghost" id="newBtn">New audit</button><button class="primary" id="modeBtn">View report</button></div></header><main id="auditView" class="work"><aside id="side" class="side"></aside><section><div class="heading"><div><label class="eyebrow" id="groupTitle"></label><h1 id="sectionTitle"></h1></div><span id="sectionCount"></span></div><div class="meta"><label>Auditor<input id="auditor"></label><label>Location<input id="location"></label><label>Date<input id="date" type="date"></label></div><div id="questions" class="questions"></div><div class="next"><button class="ghost" id="prevBtn">Previous</button><button class="primary" id="nextBtn">Next section</button></div></section></main><main id="reportView" class="report-shell hidden"><aside id="reportNav" class="report-nav"></aside><section><div class="tools"><button class="ghost" id="editBtn">← Edit</button><button class="primary" onclick="print()">Download / Print PDF</button></div><div id="report"></div></section></main><div id="toast" class="toast">Saved on this device</div><script>
const L=(p,a)=>a.map((text,i)=>({id:p+(i+1),text}));
const S=[
{title:'Host Greeting and Initial Service',group:'Host Service Check',items:[{id:'arrival',text:'Arrival time',type:'time'},...L('h',['Were you greeted in a friendly manner within 30 seconds (or an acceptable time based on business) of entering the restaurant?','If a reservation was made, were the name, number of guests, and time accurate?','If a reservation was made, was your table ready within five minutes of the appointed time?','If waiting was required, were you given an estimated wait time and seated no more than 10 minutes past it?','If waiting was required, were you offered a comfortable seating area?','Upon seating the guest, did staff remove extra place settings when applicable?'])]},
{title:'Host Facilities',group:'Host Service Check',items:L('hf',['Was the host stand free of damage and debris?','Was the entrance inviting?','Was the entrance free of debris or obstacles?'])},
{title:'Server Greeting and Initial Service',group:'Service Check',items:L('s',['Were you greeted by the server within one minute of being seated?','Did the server greet you with a warm and genuine tone?','Did the server avoid slang and phrase fragments?','Did the server smile and maintain eye contact?'])},
{title:'Beverage Service',group:'Service Check',items:L('b',['Were you offered three choices of water: sparkling, still, or filtered?','Did the server make a thoughtful beverage suggestion?','Were pre-breakfast beverages served within seven minutes?','Were refills or a new round offered before or within 30 seconds of the glass being empty?','Were alcoholic beverages visually appealing?','Were alcoholic beverages served at the appropriate temperature?','Were mixed drinks and cocktails correctly prepared and well balanced?','Did you avoid excessive wait times for all drinks?'])},
{title:'Dining Experience',group:'Service Check',items:L('d',['Did the server ask about dietary restrictions, preferences, or allergies before taking the order?','Did the server explain the menu and highlight specials?','When asked, did the server offer a thoughtful recommendation?','Could the server describe preparation methods and ingredients in detail?','If modifications were requested, did the server respond accommodatingly?','Were dishes served in the appropriate order without auctioning food?','Did the server or another associate display anticipatory service?'])},
{title:'Food Quality',group:'Service Check',items:[{id:'photo',text:'Take a picture of the food ordered.',type:'photo'},...L('f',['Was the entire meal complete and hot within 30 minutes?','Were drink refills offered before or within 30 seconds of the glass being empty?','If cold food was ordered, was it delivered within seven minutes?','If hot food was ordered, was it delivered within 10 minutes?','Did the food provide contrasting textures?','Were food items served at the appropriate temperature?','Was the flavor balanced appropriately?','Were portion sizes appropriate?','Were food presentations photogenic and dynamically interesting?'])]},
{title:'Associate Engagement and Service',group:'Service Check',items:L('a',['Did the server check back within two bites or two minutes of food delivery?','Did the server maintain an appropriate pace throughout the meal?','Did the server show genuine concern for your satisfaction?'])},
{title:'Table Maintenance and Ambiance',group:'Service Check',items:L('t',['Were you provided appropriate cutlery for each food item?','Was the table cleared at an appropriate pace?','Was the table maintained unobtrusively?','Were napkins refolded or replaced when you left the table?','Was the centerpiece appropriate to the restaurant and time of day?','Was music appropriate in style and volume?','Was the restaurant temperature appropriate?'])},
{title:'Departure',group:'Service Check',items:[{id:'departure',text:'Departure time',type:'time'},...L('dp',['Did the server maintain a comfortable pace without making you feel rushed?','Did the server offer a closing remark when presenting the bill?','Was the bill accurate and presented within two minutes of your request?','Could the server answer questions about the resort?'])]},
{title:'Facilities',group:'Service Check',items:L('fac',['All service dishes were free of damage and wear.','Cutlery was clean, polished, and free of stains.','Cutlery was free of damage and wear.','Glassware was clean and free of fingerprints, lipstick, and stains.','Glassware was free of damage and wear.','Menus were legible and free of damage and wear.','Tablecloths were clean and well ironed.','Cloth napkins were used.','Condiments were presented appropriately in clean containers.','Counters and tables were clean and not sticky.','Counters and tables were free of damage and wear.','Tables were firm and did not wobble.','Chairs and stools were clean.','Chairs and stools were free of damage and wear.','Service stations and visible areas were clean and orderly.','Service stations and visible areas were free of damage and wear.','No burned-out bulbs were observed.','Lights and lamp accessories were free of damage and wear.','Floors and carpets were free of stains, damage, dust, and excessive wear.','Walls and ceilings were free of damage and wear.','Windows were clean and free of scratches and moisture stains.'])},
{title:'Overall Associate Professionalism / Awareness',group:'Service Check',items:L('pro',['Vacant tables were actively cleared and prepared for new service.','All associates maintained an attentive and available posture.','Associates spoke clearly and professionally.','Associates smiled or maintained polite expressions.','Associates addressed guests by name when appropriate.','Associates conducted themselves discreetly and did not interrupt table interactions.','Associates were not seen eating, drinking, smoking, or chewing gum.','Associates were not observed with hands in pockets, crossed arms, or poor posture.','A manager or supervisor remained visible and attentive to guest satisfaction.','A manager or supervisor actively interacted with team members.','No associate cell phone was visible to guests.','No associate was seen using a cell phone.'])},
{title:'Review',group:'Review',items:[{id:'business',text:'Level of business',type:'rating'},{id:'experience',text:'How was your overall experience?',type:'text'},{id:'exceptional',text:'Were there any staff members who showed exceptional service?',type:'text'}]}
];
const KEY='restaurantAuditGithubV1';let state={active:0,answers:{},meta:{auditor:'Samuel McKeown',location:"J's Restaurant & Bar",date:new Date().toISOString().slice(0,10)}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(show=true){localStorage.setItem(KEY,JSON.stringify(state));if(show){$('#toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').classList.remove('show'),900)}}function patch(id,p){state.answers[id]={...(state.answers[id]||{}),...p};save(false);renderAudit()}
function renderSide(){const scored=S.flatMap(s=>s.items).filter(i=>!i.type),done=scored.filter(i=>state.answers[i.id]?.answer).length;let h=`<p>${done} of ${scored.length} answered</p><div class="bar"><i style="width:${done/scored.length*100}%"></i></div>`;[...new Set(S.map(s=>s.group))].forEach(g=>{h+=`<div class="group">${g}</div>`;S.forEach((s,i)=>{if(s.group===g){const n=s.items.filter(x=>state.answers[x.id]?.answer||state.answers[x.id]?.value||state.answers[x.id]?.photo).length;h+=`<button class="nav ${i===state.active?'on':''}" data-section="${i}"><span>${s.title}</span><em>${n}/${s.items.length}</em></button>`}})});$('#side').innerHTML=h;document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{state.active=+b.dataset.section;save(false);renderAudit();scrollTo(0,0)})}
function renderAudit(){renderSide();const s=S[state.active];$('#groupTitle').textContent=s.group;$('#sectionTitle').textContent=s.title;$('#sectionCount').textContent=`Section ${state.active+1} of ${S.length}`;['auditor','location','date'].forEach(k=>$('#'+k).value=state.meta[k]||'');$('#prevBtn').disabled=!state.active;$('#nextBtn').textContent=state.active===S.length-1?'Complete & view report':'Next section';$('#questions').innerHTML=s.items.map((it,n)=>{const a=state.answers[it.id]||{};let control='';if(it.type==='time')control=`<input class="wide value" type="time" data-id="${it.id}" value="${esc(a.value)}">`;else if(it.type==='text')control=`<textarea class="value" data-id="${it.id}" placeholder="Enter response…">${esc(a.value)}</textarea>`;else if(it.type==='rating')control=`<div class="choices rating">${[1,2,3,4,5].map(x=>`<button data-rate="${it.id}" data-value="${x}" class="${a.value==x?'selected':''}">${x}</button>`).join('')}</div>`;else if(it.type==='photo')control=`<label class="upload">${a.photo?`<img src="${a.photo}" alt="Food evidence">`:'<b>＋ Add photo</b><small>Capture or choose an image</small>'}<input data-photo="${it.id}" type="file" accept="image/*"></label>`;else control=`<div class="choices">${['Pass','Fail','N/A'].map(x=>`<button data-answer="${it.id}" data-value="${x}" class="${a.answer===x?x.replace('/','').toLowerCase():''}">${x}</button>`).join('')}</div><details ${a.note||a.action?'open':''}><summary>Add note or corrective action</summary><textarea data-note="${it.id}" placeholder="Observation or evidence…">${esc(a.note)}</textarea><input class="wide" data-action="${it.id}" placeholder="Corrective action / owner / due date…" value="${esc(a.action)}"></details>`;return `<article class="question ${a.flagged?'flagged':''}"><div class="qtitle"><span>${n+1}</span><h2>${it.text}</h2><button class="flag" data-flag="${it.id}">${a.flagged?'⚑':'⚐'}</button></div>${control}</article>`}).join('');bindInputs()}
function bindInputs(){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>patch(b.dataset.answer,{answer:b.dataset.value}));document.querySelectorAll('[data-flag]').forEach(b=>b.onclick=()=>patch(b.dataset.flag,{flagged:!state.answers[b.dataset.flag]?.flagged}));document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>patch(b.dataset.rate,{value:b.dataset.value}));document.querySelectorAll('.value').forEach(x=>x.onchange=()=>patch(x.dataset.id,{value:x.value}));document.querySelectorAll('[data-note]').forEach(x=>x.onchange=()=>patch(x.dataset.note,{note:x.value}));document.querySelectorAll('[data-action]').forEach(x=>x.onchange=()=>patch(x.dataset.action,{action:x.value}));document.querySelectorAll('[data-photo]').forEach(x=>x.onchange=()=>{const f=x.files[0];if(f){const r=new FileReader;r.onload=()=>patch(x.dataset.photo,{photo:r.result});r.readAsDataURL(f)}})}
function report(){const all=S.flatMap(s=>s.items).filter(i=>!i.type),pass=all.filter(i=>state.answers[i.id]?.answer==='Pass').length,fail=all.filter(i=>state.answers[i.id]?.answer==='Fail').length,possible=pass+fail,pct=possible?Math.round(pass/possible*100):0,flags=Object.values(state.answers).filter(a=>a.flagged).length,actions=Object.values(state.answers).filter(a=>a.action?.trim()).length;$('#reportNav').innerHTML='<a href="#overview">Overview</a>'+S.map(s=>`<a href="#${s.title.replaceAll(' ','-')}">${s.title}</a>`).join('');let h=`<section id="overview" class="card overview"><div class="report-title"><div><label class="eyebrow">Complete</label><h1>Restaurant Audit – Breakfast</h1><p>${esc(state.meta.location)}</p></div><div class="ring ${pct<80?'low':''}"><b>${pct}%</b><small>score</small></div></div><div class="metrics"><div><small>Total score</small><b>${pass} / ${possible}</b></div><div><small>Flagged items</small><b>${flags}</b></div><div><small>Created actions</small><b>${actions}</b></div></div><div class="details"><p><small>Auditor</small><b>${esc(state.meta.auditor)}</b></p><p><small>Date conducted</small><b>${esc(state.meta.date)}</b></p><p><small>Location</small><b>${esc(state.meta.location)}</b></p></div></section>`;S.forEach(s=>{const si=s.items.filter(i=>!i.type),sp=si.filter(i=>state.answers[i.id]?.answer==='Pass').length,sc=si.filter(i=>['Pass','Fail'].includes(state.answers[i.id]?.answer)).length;h+=`<section id="${s.title.replaceAll(' ','-')}" class="card"><div class="section-head"><h2>${s.title}</h2>${si.length?`<b>${sp} / ${sc} ${sc?`(${Math.round(sp/sc*100)}%)`:''}</b>`:''}</div>`+s.items.map(i=>{const a=state.answers[i.id]||{},v=a.answer||a.value||'Not answered';return `<div class="answer"><div><p>${i.text}</p>${a.note?`<small>${esc(a.note)}</small>`:''}${a.action?`<small class="action-note">Action: ${esc(a.action)}</small>`:''}</div>${i.type==='photo'&&a.photo?`<img src="${a.photo}" alt="Evidence">`:`<strong class="${String(a.answer||'').replace('/','').toLowerCase()}">${esc(v)}</strong>`}</div>`}).join('')+'</section>'});$('#report').innerHTML=h}
function setMode(mode){const r=mode==='report';$('#auditView').classList.toggle('hidden',r);$('#reportView').classList.toggle('hidden',!r);$('#modeBtn').textContent=r?'Edit audit':'View report';if(r)report();scrollTo(0,0)}
['auditor','location','date'].forEach(k=>$('#'+k).onchange=e=>{state.meta[k]=e.target.value;save()});$('#prevBtn').onclick=()=>{if(state.active){state.active--;save(false);renderAudit();scrollTo(0,0)}};$('#nextBtn').onclick=()=>{if(state.active<S.length-1){state.active++;save(false);renderAudit();scrollTo(0,0)}else setMode('report')};$('#modeBtn').onclick=()=>setMode($('#reportView').classList.contains('hidden')?'report':'audit');$('#editBtn').onclick=()=>setMode('audit');$('#newBtn').onclick=()=>{if(confirm('Start a new audit? This clears the current answers.')){state.answers={};state.active=0;save();setMode('audit');renderAudit()}};renderAudit();
</script></body></html>
